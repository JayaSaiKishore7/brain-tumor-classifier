name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moves between major versions (to Ubuntu 26 from Oct 2026).
    # Bump deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      # Runs the browser preprocessing code in tests/test_preprocess_js.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests (routes, model gate, ONNX parity, JS preprocessing, static build)
        run: pytest -v

      - name: Build static site
        run: python scripts/build_static.py

      - name: Production server starts and becomes healthy
        run: |
          PORT=7860 python web/serve.py &
          for i in $(seq 1 90); do
            if curl -fs http://127.0.0.1:7860/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "server did not become healthy within 180s" >&2
          exit 1
