[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Defaults (pyflakes + core pycodestyle) plus import sorting and common bug patterns.
extend-select = ["I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# matplotlib.use("Agg") has to run before pyplot is imported.
"src/train.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "serve", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
